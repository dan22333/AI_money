# Alembic config for the Jenny Postgres (pgvector) database.
# The DB URL is NOT set here — env.py builds it from config.settings (PG_*),
# so no credentials live in this file and it works for both the Cloud SQL unix
# socket (Cloud Run) and a TCP host (Cloud SQL Auth Proxy in the deploy job).
[alembic]
script_location = migrations
prepend_sys_path = .

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

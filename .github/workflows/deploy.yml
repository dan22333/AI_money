name: Deploy

# Deploys ONLY after CI succeeds on main. Never on a red build, never on branches.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write            # Workload Identity Federation (no JSON keys)
    env:
      PROJECT: ${{ secrets.GCP_PROJECT }}
      REGION: ${{ secrets.GCP_REGION }}
      REPO: jenny
      SERVICE: jenny-agent
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      # Build in the runner with Docker (runners have it) and push straight to
      # Artifact Registry. Avoids Cloud Build + its default-logs-bucket permission
      # issue, and is faster. The deployer SA has artifactregistry.writer.
      - name: Build & push image
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT}/${REPO}/${SERVICE}:${GITHUB_SHA::7}"
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      # 1) Deploy the new revision with a preview tag.
      #    On an EXISTING service we add --no-traffic so the candidate takes 0%
      #    of live traffic (true canary). On the FIRST-EVER deploy the service
      #    doesn't exist yet, and Cloud Run rejects --no-traffic ("not supported
      #    when creating a new service") — so we omit it and let the first
      #    revision serve 100%. Either way it also gets the `candidate` tag, so
      #    the smoke test below can hit its stable preview URL before promotion.
      - name: Deploy canary (no traffic if service exists)
        run: |
          SECRETS="OPENROUTER_API_KEY=openrouter-api-key:latest,OAUTH_CLIENT_SECRET=fanvue-client-secret:latest,FANVUE_WEBHOOK_SECRET=fanvue-webhook-secret:latest,SIM_SECRET=sim-secret:latest"
          ENVS="USE_FIRESTORE=true,GCP_PROJECT=${PROJECT},FIRESTORE_DATABASE=(default),SIM_FIRESTORE_DATABASE=staging,OPENROUTER_MODEL=x-ai/grok-4.3,MODE_MODEL=mistralai/mistral-nemo"
          if gcloud run services describe "$SERVICE" --project "$PROJECT" --region "$REGION" >/dev/null 2>&1; then
            NO_TRAFFIC="--no-traffic"
            echo "Service exists → deploying candidate at 0% traffic (canary)."
          else
            NO_TRAFFIC=""
            echo "First-ever deploy → creating service; this revision serves 100%."
          fi
          gcloud run deploy "$SERVICE" \
            --image "$IMAGE" \
            --project "$PROJECT" --region "$REGION" \
            --platform managed --allow-unauthenticated \
            --service-account "jenny-runtime@${PROJECT}.iam.gserviceaccount.com" \
            --set-secrets "$SECRETS" \
            --set-env-vars "$ENVS" \
            $NO_TRAFFIC --tag candidate

      # 2) REAL-MODEL smoke test against the candidate — gates the cutover.
      - name: Smoke test candidate (real model)
        run: |
          CAND_URL=$(gcloud run services describe "$SERVICE" --project "$PROJECT" --region "$REGION" \
            --format=json | jq -r '.status.traffic[] | select(.tag=="candidate") | .url')
          echo "candidate URL: $CAND_URL"
          curl -fsS "$CAND_URL/health" >/dev/null
          SIM=$(gcloud secrets versions access latest --secret=sim-secret --project "$PROJECT")
          REPLY=$(curl -fsS -X POST "$CAND_URL/simulate" \
            -H "x-sim-secret: $SIM" -H "content-type: application/json" \
            -d '{"text":"hey jenny, you around?"}' | jq -r '.reply // empty')
          echo "Jenny replied: $REPLY"
          test -n "$REPLY"   # fail (keep old revision live) if the real model produced no reply

      # 3) Only now shift 100% of traffic to the verified revision.
      - name: Promote candidate
        run: |
          gcloud run services update-traffic "$SERVICE" --project "$PROJECT" --region "$REGION" --to-latest

name: Deploy

# Deploys ONLY after CI succeeds on main. Never on a red build, never on branches.
# Chained jobs (build → migrate-staging → deploy-candidate → smoke → migrate-prod → promote)
# so the Actions "graph" view
# renders the pipeline as a DAG and each stage is its own pass/fail node.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  id-token: write            # Workload Identity Federation (no JSON keys)

env:
  PROJECT: ${{ secrets.GCP_PROJECT }}
  REGION: ${{ secrets.GCP_REGION }}
  REPO: jenny
  SERVICE: jenny-agent

jobs:
  # The image tag is deterministic from the commit SHA, so every job recomputes it
  # locally. (It can't be a job output: the tag embeds the PROJECT/REGION secrets,
  # and GitHub scrubs secret values out of job outputs → they'd arrive empty.)

  # 1) Build the image in the runner and push to Artifact Registry.
  build:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Build & push image
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT}/${REPO}/${SERVICE}:${GITHUB_SHA::7}"
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          docker build -t "$IMAGE" .
          docker push "$IMAGE"

  # 1b) Migrate ONLY the STAGING database here (alembic upgrade head on
  #     jenny_staging) via the Cloud SQL Auth Proxy — BEFORE the candidate serves,
  #     so the `vector` extension + any tables we own exist for the sim namespace.
  #     PROD (jenny) is deliberately NOT migrated yet — it waits until the staging-
  #     backed candidate passes smoke (see the migrate-prod job after smoke). So a
  #     migration that breaks, or that breaks the app, never touches prod's schema.
  migrate-staging:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: alembic upgrade head (staging)
        working-directory: agent
        run: |
          PG_INSTANCE="${PROJECT}:${REGION}:jenny-pg"
          curl -sSLo cloud-sql-proxy https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.14.1/cloud-sql-proxy.linux.amd64
          chmod +x cloud-sql-proxy
          ./cloud-sql-proxy --port 5432 "$PG_INSTANCE" &
          PROXY_PID=$!
          for i in $(seq 1 30); do (exec 3<>/dev/tcp/127.0.0.1/5432) 2>/dev/null && { echo "proxy up"; break; }; sleep 1; done
          uv sync --frozen
          export PG_HOST=127.0.0.1 PG_USER=postgres PG_DB=jenny_staging
          export PG_PASSWORD="$(gcloud secrets versions access latest --secret=jenny-pg-password --project "$PROJECT")"
          echo "== alembic upgrade head on jenny_staging =="
          uv run alembic upgrade head
          # Reversibility rehearsal (staging only): prove the newest migration's
          # downgrade() actually works, then re-apply — so a real rollback won't
          # hit a broken/missing downgrade. Skipped gracefully if already at base.
          echo "== verify downgrade/upgrade round-trips on jenny_staging =="
          uv run alembic downgrade -1 && uv run alembic upgrade head
          kill $PROXY_PID 2>/dev/null || true

  # 2) Deploy the new revision with 0% traffic + a `candidate` preview tag.
  #    (First-ever deploy omits --no-traffic, which Cloud Run rejects on create.)
  #    NOTE: this is NOT a traffic canary — it deploys a candidate at 0% traffic.
  #    A real canary (shift a small % of live traffic + watch metrics) would be a
  #    new stage inserted between `smoke` and `promote`.
  deploy-candidate:
    needs: migrate-staging
    runs-on: ubuntu-latest
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Deploy candidate (no traffic if service exists)
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT}/${REPO}/${SERVICE}:${GITHUB_SHA::7}"
          PG_INSTANCE="${PROJECT}:${REGION}:jenny-pg"
          SECRETS="OPENROUTER_API_KEY=openrouter-api-key:latest,OAUTH_CLIENT_SECRET=fanvue-client-secret:latest,FANVUE_WEBHOOK_SECRET=fanvue-webhook-secret:latest,SIM_SECRET=sim-secret:latest,PG_PASSWORD=jenny-pg-password:latest"
          # Long-term memory (self-hosted mem0 → Cloud SQL pgvector + Vertex embeddings).
          # GOOGLE_CLOUD_* let the Vertex SDK pick up project/region from ADC.
          ENVS="USE_FIRESTORE=true,GCP_PROJECT=${PROJECT},FIRESTORE_DATABASE=(default),SIM_FIRESTORE_DATABASE=staging,OPENROUTER_MODEL=x-ai/grok-4.3,MODE_MODEL=mistralai/mistral-nemo,MEMORY_ENABLED=true,PG_INSTANCE=${PG_INSTANCE},PG_DB=jenny,PG_USER=postgres,EMBED_MODEL=text-embedding-004,EMBED_DIM=768,VERTEX_REGION=${REGION},GOOGLE_CLOUD_PROJECT=${PROJECT},GOOGLE_CLOUD_LOCATION=${REGION}"
          # Fanvue: client id (GitHub secret) + token store = Secret Manager. The
          # fanvue-oauth-tokens secret value is created out-of-band (one-time OAuth).
          # FANVUE_TOKENS_SOURCE=firestore: the rotating OAuth token lives in a single
          # overwrite-in-place Firestore doc per creator (no Secret Manager version
          # churn, multi-creator-ready). On first boot the doc is auto-seeded from the
          # fanvue-oauth-tokens secret, so cutover needs no manual copy. A Cloud
          # Scheduler cron (infra) POSTs /admin/refresh_tokens to keep it fresh.
          ENVS="${ENVS},OAUTH_CLIENT_ID=${{ secrets.FANVUE_CLIENT_ID }},FANVUE_TOKENS_SOURCE=firestore"
          # Per-fan debounce (batch rapid-fire messages → one reply). LIVE (2026-10-19).
          # SERVICE_BASE_URL comes from the live service (empty on the first-ever deploy,
          # harmless). We do NOT attach an OIDC token to the Cloud Tasks job
          # (TASKS_INVOKER_SA unset): the service allows unauthenticated and the task
          # already carries x-sim-secret, so the enqueue needs no serviceAccounts.actAs
          # grant. (Attaching OIDC required that grant and 403'd the enqueue → inline
          # fallback → one reply per message. Re-add TASKS_INVOKER_SA only together with
          # that IAM binding if you later require auth on the service.)
          BASE_URL=$(gcloud run services describe "$SERVICE" --project "$PROJECT" --region "$REGION" --format='value(status.url)' 2>/dev/null || true)
          ENVS="${ENVS},DEBOUNCE_ENABLED=true,TASKS_QUEUE=jenny-process,TASKS_LOCATION=${REGION},SERVICE_BASE_URL=${BASE_URL}"
          # Memory scaling — LIVE (2026-10-19, after the db-g1-small tier bump + queue apply):
          # HNSW index + pgvector pool sizing, extraction fan-out onto jenny-extract, and
          # expanded recall (multi-probe memory lookup) when composing replies.
          ENVS="${ENVS},MEMORY_USE_HNSW=true,MEMORY_PG_MINCONN=1,MEMORY_PG_MAXCONN=5,MEMORY_FANOUT_ENABLED=true,EXTRACT_TASKS_QUEUE=jenny-extract,RECALL_STRATEGY=expanded"
          if gcloud run services describe "$SERVICE" --project "$PROJECT" --region "$REGION" >/dev/null 2>&1; then
            NO_TRAFFIC="--no-traffic"
            echo "Service exists → candidate at 0% traffic."
          else
            NO_TRAFFIC=""
            echo "First-ever deploy → creating service; this revision serves 100%."
          fi
          gcloud run deploy "$SERVICE" \
            --image "$IMAGE" \
            --project "$PROJECT" --region "$REGION" \
            --platform managed --allow-unauthenticated \
            --service-account "jenny-runtime@${PROJECT}.iam.gserviceaccount.com" \
            --add-cloudsql-instances "$PG_INSTANCE" \
            --memory 1Gi --cpu 1 \
            --max-instances 40 --concurrency 24 \
            --set-secrets "$SECRETS" \
            --set-env-vars "$ENVS" \
            $NO_TRAFFIC --tag candidate

  # 3) REAL-MODEL smoke test against the candidate — gates the cutover.
  smoke:
    needs: deploy-candidate
    runs-on: ubuntu-latest
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Smoke test candidate (real model)
        run: |
          CAND_URL=$(gcloud run services describe "$SERVICE" --project "$PROJECT" --region "$REGION" \
            --format=json | jq -r '.status.traffic[] | select(.tag=="candidate") | .url')
          echo "candidate URL: $CAND_URL"
          curl -fsS "$CAND_URL/health" >/dev/null
          SIM=$(gcloud secrets versions access latest --secret=sim-secret --project "$PROJECT")
          REPLY=$(curl -fsS -X POST "$CAND_URL/simulate" \
            -H "x-sim-secret: $SIM" -H "content-type: application/json" \
            -d '{"text":"hey jenny, you around?"}' | jq -r '.reply // empty')
          echo "Jenny replied: $REPLY"
          test -n "$REPLY"   # fail (keep old revision live) if the real model produced no reply
          # Memory gate: real write+read roundtrip in the STAGING collection.
          # memcheck returns 503 if memory is enabled-but-broken (curl -f fails),
          # so a silently-degraded memory layer can't be promoted.
          MEM=$(curl -fsS -X POST "$CAND_URL/admin/memcheck" -H "x-sim-secret: $SIM" | jq -r '.status')
          echo "memcheck status: $MEM"
          test "$MEM" = "ok" -o "$MEM" = "disabled"
          # New-surface smoke (read-only / no-op) so a broken debounce or recall
          # route fails the CANARY before any traffic is shifted:
          #  - recall_eval must return a strategy for a sim fan
          RECALL=$(curl -fsS -X POST "$CAND_URL/admin/recall_eval" -H "x-sim-secret: $SIM" \
            -H "content-type: application/json" \
            -d '{"fan_id":"sim:smoke","message":"hey jenny"}' | jq -r '.strategyInUse')
          echo "recall_eval strategyInUse: $RECALL"
          test -n "$RECALL"
          #  - the debounce worker endpoint must respond; a sim fan with no pending
          #    messages makes it a safe no-op ("nothing")
          PF=$(curl -fsS -X POST "$CAND_URL/admin/process_fan" -H "x-sim-secret: $SIM" \
            -H "content-type: application/json" -d '{"fan_id":"sim:smoke"}' | jq -r '.status')
          echo "process_fan status: $PF"
          test "$PF" = "nothing"
          #  - the extraction fan-out worker must respond; a sim fan + trivial turn is
          #    a safe learn into the STAGING memory collection
          EX=$(curl -fsS -X POST "$CAND_URL/admin/extract_memory" -H "x-sim-secret: $SIM" \
            -H "content-type: application/json" \
            -d '{"fan_id":"sim:smoke","incoming":"hi","final":"hey"}' | jq -r '.status')
          echo "extract_memory status: $EX"
          test "$EX" = "learned"
          #  - the proactive token refresher must respond with NO per-creator errors
          #    (errors>0 = the refresh endpoint / token store wiring is broken). It
          #    only rotates a token that's near expiry, so this is normally a no-op.
          RT=$(curl -fsS -X POST "$CAND_URL/admin/refresh_tokens" -H "x-sim-secret: $SIM")
          echo "refresh_tokens: $RT"
          test "$(echo "$RT" | jq -r '.status')" = "ok"
          test "$(echo "$RT" | jq -r '.errors')" = "0"

  # 3b) Migrate PROD (jenny) — ONLY after the staging-backed candidate passed smoke.
  #     So prod's schema changes only once the exact migration + new code have been
  #     proven on the staging DB end-to-end. Migrations must stay backward-compatible
  #     (expand/contract): prod schema changes here while the OLD revision is still
  #     serving 100%, and the new code isn't promoted until the next job.
  migrate-prod:
    needs: smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: alembic upgrade head (prod)
        working-directory: agent
        run: |
          PG_INSTANCE="${PROJECT}:${REGION}:jenny-pg"
          curl -sSLo cloud-sql-proxy https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.14.1/cloud-sql-proxy.linux.amd64
          chmod +x cloud-sql-proxy
          ./cloud-sql-proxy --port 5432 "$PG_INSTANCE" &
          PROXY_PID=$!
          for i in $(seq 1 30); do (exec 3<>/dev/tcp/127.0.0.1/5432) 2>/dev/null && { echo "proxy up"; break; }; sleep 1; done
          uv sync --frozen
          export PG_HOST=127.0.0.1 PG_USER=postgres PG_DB=jenny
          export PG_PASSWORD="$(gcloud secrets versions access latest --secret=jenny-pg-password --project "$PROJECT")"
          echo "== alembic upgrade head on jenny (prod) =="
          uv run alembic upgrade head
          kill $PROXY_PID 2>/dev/null || true

  # 4) Only now shift 100% of traffic to the verified revision.
  promote:
    needs: migrate-prod
    runs-on: ubuntu-latest
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Promote candidate to 100%
        run: gcloud run services update-traffic "$SERVICE" --project "$PROJECT" --region "$REGION" --to-latest

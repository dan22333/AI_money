name: Deploy

# Deploys ONLY after CI succeeds on main. Never on a red build, never on branches.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write            # Workload Identity Federation (no JSON keys)
    env:
      PROJECT: ${{ secrets.GCP_PROJECT }}
      REGION: ${{ secrets.GCP_REGION }}
      REPO: jenny
      SERVICE: jenny-agent
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build & push image
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT}/${REPO}/${SERVICE}:${GITHUB_SHA::7}"
          # --suppress-logs: the deployer SA isn't a project Viewer, so gcloud can't
          # stream the default-bucket build logs (would exit 1 even on a successful build).
          gcloud builds submit --tag "$IMAGE" --project "$PROJECT" --suppress-logs .
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Deploy to Cloud Run
        run: |
          SECRETS="OPENROUTER_API_KEY=openrouter-api-key:latest,OAUTH_CLIENT_SECRET=fanvue-client-secret:latest,FANVUE_WEBHOOK_SECRET=fanvue-webhook-secret:latest,SIM_SECRET=sim-secret:latest"
          ENVS="USE_FIRESTORE=true,GCP_PROJECT=${PROJECT},OPENROUTER_MODEL=x-ai/grok-4.3,MODE_MODEL=mistralai/mistral-nemo"
          gcloud run deploy "$SERVICE" \
            --image "$IMAGE" \
            --project "$PROJECT" --region "$REGION" \
            --platform managed --allow-unauthenticated \
            --set-secrets "$SECRETS" \
            --set-env-vars "$ENVS"
